version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://coffeeshop:coffeeshop123@db:3306/coffee_shop?charset=utf8mb4
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
    depends_on:
      - db
    volumes:
      - ./app/static/images:/app/app/static/images

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: coffee_shop
      MYSQL_USER: coffeeshop
      MYSQL_PASSWORD: coffeeshop123
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
